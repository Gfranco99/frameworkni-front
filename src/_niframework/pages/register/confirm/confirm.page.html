<ion-content  color="light" padding class="animated fadeIn login auth-page">
  <ion-grid [fixed]="true">


    <ion-row>
      <ion-col size="1">
        <ion-router-link href="#">
          <ion-icon size="large" name="arrow-back"></ion-icon>
        </ion-router-link>
      </ion-col>
      <ion-col size="10">
        <!-- Logo -->
        <div padding-horizontal text-center class="animated fadeInDown ion-text-center">
          <div class="logo">
            <img src="../../../assets/img/logo.webp" />
            <!-- <ion-img [src]="logoBinary"></ion-img> -->
          </div>
          <h3 no-margin>
            <ion-text color="light">
              <ion-text color="primary" *ngIf="!activated">Confirmar Cadastro</ion-text>
              <ion-text color="primary" *ngIf="activated">E-mail confirmado com sucesso!</ion-text>
            </ion-text>
          </h3>
        </div>
      </ion-col>
      <ion-col size="1"></ion-col>
    </ion-row>


    <div *ngIf="!activated">
      <ion-col>
        <div class="ion-text-center">
          <h5>Confirme o seu cadastro acessando o link enviado para o email: <b>{{userEmail}}</b></h5>
        </div>
      </ion-col>

      <ion-col>
        <div class="ion-text-center">
          <p>Algo de errado com o e-mail ?</p>

          <ion-button expand="block" fill="clear" color="secondary" (click)="resendConfirmationEmail()">Reenviar link</ion-button>
        </div>
      </ion-col>
    </div>

    <div *ngIf="activated">
      <ion-row>
      <ion-col size=2></ion-col>
        <ion-col size=8>
          <ion-button  expand="block" color="primary" routerLink="login">Login</ion-button>
        </ion-col>
        <ion-col size=2></ion-col>
    </ion-row>
    </div>

  </ion-grid>
</ion-content>
