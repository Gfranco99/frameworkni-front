<ion-content color="secondary">
  <ion-header [translucent]="true">
    <ion-toolbar color="primary">
      <ion-buttons slot="start">
        <ion-back-button [text]="" defaultHref="" (click)="back()"></ion-back-button>
      </ion-buttons>
      <ion-title>Grupos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row class="height">
      <!-- Painel de controle de grupos -->
      <ion-col>
        <ion-row class="ion-padding ion-align-items-center" *ngIf="checkRole(['CRIAR_GRUPO'])">
          <ion-button size="small" (click)="newGroup()">
            <ion-icon slot="start" name="people-outline" size="small"></ion-icon>
            novo grupo
          </ion-button>
        </ion-row>
        <ion-row class="ion-padding" >
          <table mat-table [dataSource]="dataSource"  class="mat-elevation-z8" matSort>
            <!-- Coluna id -->
            <ng-container matColumnDef="idGrupo">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
              <td mat-cell *matCellDef="let element"> {{element['idGrupo']}} </td>
            </ng-container>
            <!-- Coluna nome -->
            <ng-container matColumnDef="nomeGrupo">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome do grupo </th>
              <td mat-cell *matCellDef="let element"> {{element.nomeGrupo}} </td>
            </ng-container>
            <!-- Coluna descrição -->
            <ng-container matColumnDef="descricaoGrupo">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Descrição </th>
              <td mat-cell *matCellDef="let element"> {{element.descricaoGrupo}} </td>
            </ng-container>
            <!-- Coluna ativo -->
            <ng-container matColumnDef="ativo">
              <th mat-header-cell *matHeaderCellDef mat-sort-header> Habilitado </th>
              <td mat-cell *matCellDef="let element"> {{element.ativo}} </td>
            </ng-container>
            <!-- Coluna editar -->
            <ng-container matColumnDef="editar">
              <th mat-header-cell *matHeaderCellDef></th>
              <td mat-cell *matCellDef="let element">
                <ion-button
                  [disabled]="!element.ativo"
                  (click)="editGroup(element.idGrupo)"
                  title="Editar grupo"
                  class="button"
                  shape="round"
                  mode="ios"
                  color="dark"
                  size="small"
                  >
                  <ion-icon slot="start" name="cog-outline" size="small"></ion-icon>
                Editar 
              </ion-button>        
                  <!-- <ion-icon name="options-outline" size="large" class="table-link"></ion-icon> -->
              </td>
            </ng-container>
             <!-- Coluna remover -->
             <ng-container matColumnDef="remover">
              <th mat-header-cell *matHeaderCellDef></th>
              <td mat-cell *matCellDef="let element">
                <ion-button
                title="Irá excluir o grupo definitivamente"
                class="button"
                shape="round"
                mode="ios"
                color="danger"
                size="small"
                (click)="deleteGroup(element.idGrupo)"
                >
                <ion-icon slot="start" name="trash-outline" size="small"></ion-icon>
                Excluir 
              </ion-button>        
              </td>
            </ng-container>
            <!-- Coluna ativar/desativar -->
            <ng-container matColumnDef="desativar" class="mat-column-ativo">
              <th mat-header-cell *matHeaderCellDef>Desativar/Ativar</th>
              <td mat-cell *matCellDef="let element">
                <ion-toggle
                  class="table-link toggle"
                  [checked]="element.ativo"
                  (click)="inAtivo($event, element)"
                ></ion-toggle>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </ion-row>

        <!-- Páginação da tabela -->
          <mat-paginator
            #paginator
            [pageSizeOptions]="[10, 20, 50]"
            showFirstLastButtons 
            aria-label="Select page of periodic elements">
          </mat-paginator>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
