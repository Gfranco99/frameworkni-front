<ion-card>
  <ion-grid>   
    <ion-row>
      <ion-col size="3">
        <ion-card-title>{{cardTitle}}</ion-card-title>
        <ion-badge mode="ios" animated="true" color="warning" text="light" *ngIf="changes"> Pendente </ion-badge>
      </ion-col>
      <ion-col size="6" class="groupItems">
        <ion-badge
          mode="ios"
          color="primary"
          class="textCardItem"
          animated="true"
          *ngFor="let i of currentDataAttributes"
          >{{i[keyNameItem]}}
        </ion-badge>      
      </ion-col>
      <ion-col id="groupButtons" class="groupButtons" size="3">
        <div style="display: flex; flex-direction: column;">

          <ion-button
            class="button"
            shape="round"
            mode="ios"
            color="dark"
            size="small"
            disabled="{{!unlockFunctions}}"
            (click)="editCategory()"
            >
            <ion-icon slot="start" name="cog-outline" size="small"></ion-icon>
            Editar
          </ion-button>
            
            
          <ion-button
            *ngIf="changes"
            class="button"
            shape="round"
            mode="ios"
            color="warning"
            size="small"
            disabled="{{!unlockFunctions}}"
            (click)="saveData()"
            > 
            <ion-icon slot="start" name="save-outline" size="small"></ion-icon>
            Salvar
          </ion-button>

        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-card>
