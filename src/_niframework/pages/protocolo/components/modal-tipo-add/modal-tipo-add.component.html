<ion-toolbar color="primary">
  <ion-title>Tipo de Protocolo</ion-title>
  <ion-buttons slot="end">
    <ion-button (click)="close()">
      <ion-icon name="close" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-buttons>
</ion-toolbar>

<ion-content >
  <ion-grid [fixed]="true">
      <ion-list>
          <ion-radio-group [(ngModel)]="tipo">            
              <ion-item>
                  <ion-label>Certidão</ion-label>
                  <ion-radio slot="start" value="1"></ion-radio>
              </ion-item>
          
              <ion-item>
                  <ion-label>Exame e Cálculo</ion-label>
                  <ion-radio slot="start" value="2"></ion-radio>
              </ion-item>

              <ion-item>
                  <ion-label>Prenotação</ion-label>
                  <ion-radio slot="start" value="3"></ion-radio>
              </ion-item>
          </ion-radio-group>
      </ion-list>

      <br>
      <div style="text-align: center;">
          <ion-button [disabled]="!tipo" (click)="filter()" style="width: 80%;">Selecionar</ion-button>
      </div>
      
  </ion-grid>
</ion-content>
