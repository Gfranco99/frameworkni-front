<ion-toolbar color="primary">
    <ion-title>Ordenar por:</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  
  <ion-content >
    <ion-grid [fixed]="true">
        <ion-list>
            <ion-radio-group [(ngModel)]="filtro"> 
                <ion-item>
                    <ion-label>FILTROS</ion-label> 
                </ion-item>          
                <ion-item>
                    <ion-label>Todos os Protocolos</ion-label>
                    <ion-radio slot="start" value="TODOS"></ion-radio>
                </ion-item>

                <ion-item>
                    <ion-label>Apenas Titulos</ion-label>
                    <ion-radio slot="start" value="PROTOCOLO"></ion-radio>
                </ion-item>
            
                <ion-item>
                    <ion-label>Apenas Agendamentos</ion-label>
                    <ion-radio slot="start" value="AGENDA"></ion-radio>
                </ion-item>
            </ion-radio-group>

            <ion-radio-group [(ngModel)]="ordem"> 
                <ion-item>
                    <ion-label>ORDENAÇÃO</ion-label>
                </ion-item>

                <ion-item>
                    <ion-label>Ordem Padrão</ion-label>
                    <ion-radio slot="start" value="ORDEM PADRÃO"></ion-radio>
                </ion-item>

                <ion-item>
                    <ion-label>Adicionado Recentemente</ion-label>
                    <ion-radio slot="start" value="ADICIONADO RECENTEMENTE"></ion-radio>
                </ion-item>

                <ion-item>
                    <ion-label>Data de Última Atualização</ion-label>
                    <ion-radio slot="start" value="DATA ATUALIZADO"></ion-radio>
                </ion-item>
            
                <ion-item>
                    <ion-label>Status do Andamento</ion-label>
                    <ion-radio slot="start" value="STATUS ANDAMENTO"></ion-radio>
                </ion-item>
            </ion-radio-group>
        </ion-list>

        <br>
        <div style="text-align: center;">
            <ion-button [disabled]="!filtro || !ordem" (click)="filter()" style="width: 80%;">Ir</ion-button>
        </div>
        
    </ion-grid>
</ion-content>
